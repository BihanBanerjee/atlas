[project]
name = "atlas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bihan Banerjee", email = "banerjeebihan456@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.124.0",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
atlas = "atlas:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
eval = [
    "datasets>=5.0.1",
    "langchain-community<0.4",
    "pillow>=12.3.0",
    "ragas>=0.3.1",
]

[tool.uv]
default-groups = ["eval"]
